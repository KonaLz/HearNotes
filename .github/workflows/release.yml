name: Source checks
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate frontend and export interaction
        run: |
          node --check HearNotes/ui/app.js
          node --check HearNotes/ui/i18n.js
          node scripts/test-export.cjs
      - name: Validate Python syntax
        run: python3 -m compileall -q HearNotes/core.py HearNotes/server.py HearNotes/worker.py
      # Signed installers are built on the prepared local Windows machine.
      # A fresh hosted runner does not contain the excluded native runtime libraries.
